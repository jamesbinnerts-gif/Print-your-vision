<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Print Your Vision</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Print Your Vision</h1>
    <p>3D geprinte producten op maat</p>
</header>

<div class="products">

    <!-- PRODUCT 1 -->
    <div class="product">
        <h3>Blikopener met deksel</h3>
        <img src="blikopener.jpg" alt="Blikopener met deksel">

        <label>Kleur:</label>
        <select>
            <option>Zwart</option>
            <option>Wit</option>
            <option>Grijs</option>
            <option>Rood</option>
            <option>Groen</option>
            <option>Blauw</option>
            <option>Licht roze</option>
            <option>Oranje</option>
        </select>

        <br><br>

        <label>Aantal:</label>
        <input type="number" value="1" min="1">

        <br><br>

        <button class="whatsapp-btn" onclick="bestelProduct('Blikopener met deksel', this)">
            Bestel via WhatsApp
        </button>
    </div>

    <!-- PRODUCT 2 -->
    <div class="product">
        <h3>Peper en zout kamado BBQ</h3>
        <img src="placeholder.jpg" alt="Peper en zout kamado BBQ">

        <label>Kleur:</label>
        <select>
            <option>Zwart</option>
            <option>Wit</option>
            <option>Grijs</option>
            <option>Rood</option>
            <option>Groen</option>
            <option>Blauw</option>
            <option>Licht roze</option>
            <option>Oranje</option>
        </select>

        <br><br>

        <label>Aantal:</label>
        <input type="number" value="1" min="1">

        <br><br>

        <button class="whatsapp-btn" onclick="bestelProduct('Peper en zout kamado BBQ', this)">
            Bestel via WhatsApp
        </button>
    </div>

</div>
<footer>
    <p>Hulp nodig? Neem contact op via <strong>+31 6 23010458</strong></p>
</footer>

<script src="script.js"></script>
</body>
</html>
