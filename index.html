<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Your Vision</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Print Your Vision</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#producten">Producten</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section id="home">
        <h2>Unieke, zelfgemaakte 3D-prints</h2>
        <p>Bekijk onze collectie en bestel via WhatsApp!</p>
    </section>

    <section id="producten">
        <h2>Onze Prints</h2>

        <!-- Voorbeeld product -->
        <div class="product">
            <img src="placeholder.jpg" alt="Sleutelhanger">
            <h3>Sleutelhanger</h3>
            <p>Kies kleur en aantal</p>
            <label>Kleur:
                <select class="kleur">
                    <option>zwart</option>
                    <option>wit</option>
                    <option>grijs</option>
                    <option>rood</option>
                    <option>groen</option>
                    <option>blauw</option>
                    <option>licht roze</option>
                </select>
            </label>
            <label>Aantal:
                <input type="number" class="aantal" value="1" min="1">
            </label>
            <button class="whatsapp-btn">Bestel via WhatsApp</button>
        </div>

        <!-- Voeg hier extra producten toe op dezelfde manier -->
    </section>

    <section id="contact">
        <h2>Contact / WhatsApp</h2>
        <p>Stuur ons een bericht via WhatsApp: <a href="https://wa.me/31623010458" target="_blank">+31 6 23010458</a></p>
    </section>

    <footer>
        <p>&copy; 2025 Print Your Vision</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
